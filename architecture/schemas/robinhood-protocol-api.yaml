# Declared shapes owned by robinhood-protocol-api.
#
# Scope of this file, deliberately: only types whose fields are determined by
# something outside this repository — the V4 ABI, an EVM standard, or this
# contract's own prose. A type whose fields are an open design question is
# absent on purpose; the right state for it is no schema, so that
# SCHEMA_UNDECLARED keeps saying so, rather than a shell written to silence a
# warning. See README.md.

# --- EVM primitives ---------------------------------------------------------

Address:
  description: >
    A 20-byte EVM account or contract address. The parsed form. What a
    capability returns; not what it accepts.
  type: string
  pattern: "^0x[0-9a-f]{40}$"
  x-solidity-type: address
  x-note: >
    Always lowercase. The EIP-55 mixed-case checksum is a display and error
    *detection* convention for humans, not a second value — a checksummed and
    a lowercase spelling of one address are the same address, and a system
    that treats them as two distinct values will compare them unequal. Parse
    accepts either; this type is the single normalised form.
  x-source: EIP-55 (checksum casing), the address type being 20 bytes

AddressString:
  description: >
    A hexadecimal address as it arrives from outside, before parsing.
  type: string
  pattern: "^0x[0-9a-fA-F]{40}$"
  x-solidity-type: address
  x-note: >
    `protocol.identity.address.parse` accepts EIP-55 mixed-case or
    all-lowercase. All-uppercase is rejected: it carries no checksum, so a
    typo in it is undetectable, and accepting it would silently accept
    corrupted input that a mixed-case spelling would have caught. Not
    `^0x[0-9a-f]{40}$` — that would reject the valid checksummed form this
    capability exists to accept.
  x-source: EIP-55

ChainId:
  description: A positive EVM chain id, parsed.
  type: integer
  minimum: 1
  x-note: >
    Not an enum. This architecture pins the chains it uses in
    `architecture/project.yaml` (`chain_scope` / `excluded_chains`), and that
    is where a chain is verified against a live `eth_chainId`; a type-level
    enum would freeze today's answer into something the loader could not
    check and nobody could re-verify.
  x-source: architecture/project.yaml

ChainIdString:
  description: A chain id as decimal text, before parsing.
  type: string
  pattern: "^[0-9]+$"
  x-note: >
    Digits only. `0x` and a leading `+` are rejected so that one chain id has
    exactly one accepted spelling; "4663", "0x1237" and "+4663" are the same
    number and comparing them as strings would not say so.
  x-source: architecture/project.yaml

# --- V4 pool identity -------------------------------------------------------

PoolKey:
  description: >
    A V4 pool's full identity, in the field order V4 hashes. This is the
    pre-image of PoolId.
  type: object
  additionalProperties: false
  required: [currency0, currency1, fee, tick_spacing, hooks]
  properties:
    currency0:
      description: The numerically lower of the two currencies.
      $ref: "#/Address"
      x-solidity-type: Currency
    currency1:
      description: The numerically higher of the two currencies.
      $ref: "#/Address"
      x-solidity-type: Currency
    fee:
      description: >
        Static LP fee in hundredths of a basis point, i.e. 3000 is 0.30%.
        The static fee's maximum is 1_000_000 (100%). A dynamic-fee pool
        carries the sentinel 0x800000 instead of a real rate.
      type: integer
      # A uint24 could hold up to 16777215, but V4 rejects anything above
      # MAX_LP_FEE as a static fee. Bounding at the uint24 range instead would
      # accept a key V4 itself would revert on, and the failure would surface
      # as a revert at Initialize rather than as a rejected key here.
      minimum: 0
      anyOf:
        - maximum: 1000000
        - const: 8388608      # DYNAMIC_FEE_FLAG
      x-solidity-type: uint24
      x-max-lp-fee: 1000000
      x-dynamic-fee-sentinel: 8388608
      x-source: Uniswap v4-core src/libraries/LPFeeLibrary.sol (MAX_LP_FEE, isValid)
    tick_spacing:
      description: >
        Ticks a position may use must be a multiple of this. May be negative
        for pools whose tick direction is inverted.
      type: integer
      minimum: -32768
      maximum: 32767
      x-solidity-type: int16
    hooks:
      description: >
        The pool's hook contract. The zero address means no hooks, and it is
        a value, not an absence.
      $ref: "#/Address"
      x-solidity-type: IHooks
  x-note: >
    Field order is load-bearing and is not incidental: PoolId is keccak256 over
    the ABI encoding of this struct, so a schema that permitted a different
    order would describe a different pool. `additionalProperties: false` is
    therefore correctness, not tidiness.
  x-source: Uniswap v4-core src/types/PoolKey.sol

PoolId:
  description: >
    keccak256 over the 160 bytes (five 32-byte words) of the ABI-encoded
    PoolKey. Two equal keys give byte-identical ids in any process.
  type: string
  pattern: "^0x[0-9a-f]{64}$"
  x-solidity-type: PoolId (bytes32)
  x-derived-from: PoolKey
  x-construction: "keccak256(abi.encode(PoolKey))"
  x-note: >
    The hash is over the struct's memory layout, which is NOT
    keccak256(abi.encodePacked(...)): the two differ, because every field is
    padded to a full 32-byte word. An encoder using packed encoding computes a
    different id for the same pool — a wrong answer that is still 32 bytes of
    hex and will not look wrong.
  x-source: Uniswap v4-core src/types/PoolId.sol (PoolIdLibrary.toId)

PoolKeyRaw:
  description: >
    A PoolKey as it arrives ABI-encoded, before decoding and before the
    currency ordering is checked.
  type: string
  pattern: "^0x([0-9a-fA-F]{2})+$"
  x-note: >
    Opaque bytes, not a structured object: this is the wire form, and
    `protocol.pool_key.parse` is what turns it into a PoolKey. It is
    deliberately not modelled field-by-field, because the check that matters
    — currency0 < currency1 as uint160 — is the parse capability's job and
    re-expressing the bytes here would duplicate it in a place nothing checks.
  x-source: Uniswap v4-core IPoolManager event ABI

# --- V4 price ---------------------------------------------------------------

SqrtPriceX96:
  description: Square root of the token1/token0 price, fixed point.
  type: integer
  minimum: 0
  x-encoding: q64.96
  x-formula: "sqrtPriceX96 = floor(sqrt(price) * 2**96)"
  x-inverse: "price = (sqrtPriceX96 / 2**96) ** 2"
  x-solidity-type: uint160
  x-source: Uniswap v4-core src/libraries/SqrtPriceMath.sol; Q96 = 2**96

SqrtPriceTick:
  description: >
    One observation of a pool's price, published to subscribers. The payload of
    `protocol.sqrt_price.observed`.
  type: object
  additionalProperties: false
  required: [pool_id, sqrt_price_x96, tick, block_number, transaction_index, log_index]
  properties:
    pool_id: { $ref: "#/PoolId" }
    sqrt_price_x96: { $ref: "#/SqrtPriceX96" }
    tick:
      description: >
        The pool's current tick, and the index a position's range is stated
        in. Signed.
      type: integer
      minimum: -887272
      maximum: 887272
      x-solidity-type: int24
    block_number:
      description: >
        Block the observation was mined in. Part of the total order and of the
        duplicate key.
      type: integer
      minimum: 0
    transaction_index:
      description: Index of the transaction within the block.
      type: integer
      minimum: 0
    log_index:
      description: Index of the log within the block.
      type: integer
      minimum: 0
  x-note: >
    The three ordering fields are required by the contract's own prose — it
    says subscribers MUST treat events as totally ordered and that duplicates
    are dropped by (block_number, transaction_index, log_index) — so a payload
    without them could not support the behaviour the contract promises.
    Nothing here is invented; every field is named in that description.
  x-source: robinhood-protocol-api protocol.sqrt_price.observed description

# --- Display boundary -------------------------------------------------------

SqrtPriceToDisplayRequest:
  description: Input to `protocol.sqrt_price.to_display`.
  type: object
  additionalProperties: false
  required: [sqrt_price_x96]
  properties:
    sqrt_price_x96: { $ref: "#/SqrtPriceX96" }

DisplayPrice:
  description: >
    A human-facing price. The output of the one named display boundary
    (ADR-009); the inverse direction does not exist in V1.
  type: string
  pattern: "^-?[0-9]+(\\.[0-9]{1,18})?$"
  x-type-note: >
    Carried as a string, not a JSON number, because a JSON number is an IEEE
    double: 18 fractional digits of price do not survive one, and a display
    price that silently rounds is exactly the failure a named display boundary
    exists to prevent. Parse to Decimal at the edge.
  x-precision: "Decimal rounded to 18 fractional digits"
  x-out-of-range: >
    A price needing more than 18 fractional digits is not a DisplayPrice.
    That is the same condition protocol.sqrt_price.to_display reports as
    PROTOCOL_DISPLAY_OUT_OF_RANGE, so the error code is reachable rather than
    dead — the two are two halves of one rule and must be changed together.
  x-source: robinhood-protocol-api protocol.sqrt_price.to_display (ADR-009)

# --- closed vocabularies ----------------------------------------------------

SizingErrorVocabulary:
  description: >
    Every error code `protocol.sizing.compute` can return. Consumers branch on
    these strings, never on internal exception class names.
  type: array
  minItems: 1
  uniqueItems: true
  items:
    type: string
    enum:
      - PROTOCOL_INVALID_POOL_KEY
      - PROTOCOL_ORDER_VIOLATION
      - PROTOCOL_RANGE_DEGENERATE
      - PROTOCOL_TICK_OUT_OF_BOUNDS
      - PROTOCOL_TICK_NOT_ALIGNED
      - PROTOCOL_CAPITAL_EXCESSIVE
      - PROTOCOL_HOOK_EVIDENCE_MISSING
      - PROTOCOL_BELOW_MINIMUM_SIZE
  x-note: >
    Each code's `recoverable` class is NOT repeated here. It is declared once,
    on the capability's own `errors:` block, and that block is the authority:
    a second copy is a second thing to keep in step, and a sizer that treats
    PROTOCOL_HOOK_EVIDENCE_MISSING as retryable because this list lost track
    of its class is exactly the silent change this architecture cannot detect.
    Read the class from the capability.
  x-source: robinhood-protocol-api protocol.sizing.compute errors block

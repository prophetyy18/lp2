name: pricing-api
version: 1
description: >
  Position and risk valuation. Built on market-data-api; consumers never read
  market-data implementation directly for anything pricing already exposes.

requires:
  - market-data-api

provides:
  - id: position.mark
    kind: operation
    input:  { schema: pricing-api.MarkRequest }
    output: { schema: pricing-api.MarkResult }
    errors:
      - { code: PRICING_PRICE_UNAVAILABLE, recoverable: transient }
      - { code: PRICING_STALE_PRICE,       recoverable: transient }
      - { code: PRICING_INVALID_INPUT,     recoverable: user_input }
    behavior:
      unit: decimal
      time: event_time
      idempotent: true
      ordering: total
    description: >
      Mark-to-market value of a portfolio. Currency is the base currency of the
      portfolio, rounded to 8 decimal places.

  - id: position.exposure
    kind: operation
    input:  { schema: pricing-api.ExposureRequest }
    output: { schema: pricing-api.ExposureResult }
    errors:
      - { code: PRICING_UNKNOWN_FACTOR,    recoverable: user_input }
      - { code: PRICING_PRICE_UNAVAILABLE, recoverable: transient }
    behavior:
      unit: decimal
      time: event_time
      idempotent: true
    description: >
      Exposure to a risk factor. The factor must be one of the names returned
      by `position.risk_factors`.

  - id: position.risk_factors
    kind: data
    output: { schema: pricing-api.RiskFactorList }
    description: >
      Supported risk factor names. This is a contract extension point, so
      adding a name here requires a contract version bump.

  - id: pricing.quote
    kind: operation
    input:  { schema: pricing-api.QuoteRequest }
    output: { schema: pricing-api.Quote }
    errors:
      - { code: PRICING_PRICE_UNAVAILABLE, recoverable: transient }
      - { code: PRICING_INVALID_INPUT,     recoverable: user_input }
    behavior:
      unit: usdg
      time: event_time
      idempotent: true
      stale_tolerance: "5min"
    description: Mid price for a single symbol.

  - id: pricing.quote.updated
    kind: event
    payload: { schema: pricing-api.QuoteTick }
    behavior:
      unit: usdg
      time: event_time
      ordering: total
    description: >
      Emitted when a new mid price is observed. Subscribers MUST treat
      events as totally ordered by event time; consumers should dedupe
      by (symbol, observed_at).
name: robinhood-web-api
version: 1
description: >
  HTTP presentation surface: prepaper authorization (T073), runs
  list/trigger/monitor/cancel (T087), backtest result view (T088),
  and research pages (T103). Translates requests into contract
  calls; owns no business rules. Every route is declared in terms
  of a capability id, not a Python function.

requires:
  - robinhood-application-api
  - robinhood-reports-api

provides:
  - id: web.prepaper.authorize
    kind: function
    signature: "web.prepaper.authorize(pool_key: PoolKey, decision: PrePaperDecision) -> AuthorizationToken"
    description: >
      T073 bounded pre-paper authorization entry. Active PoolKey,
      HOLD / LP approvals, and a preliminary-paper authorization
      token. The token is the audit artifact; the gateway denies
      duplicate or stale tokens.
  - id: web.runs.list
    kind: function
    signature: "web.runs.list(filter: RunsFilter) -> list[RunRecord]"
    description: List registered runs matching the supplied filter.
  - id: web.runs.trigger
    kind: function
    signature: "web.runs.trigger(request: RunRequest) -> RunId"
    description: >
      Submit a new backtest run. Composes application.backtest.start.
      Returns the RunId; the run lifecycle is observable through
      web.runs.list and web.runs.monitor.
  - id: web.runs.cancel
    kind: function
    signature: "web.runs.cancel(run_id: RunId) -> None"
    description: >
      Cooperative cancel: set the cancel token, let the engine poll,
      transition the run to CANCELLED with a structured reason. No
      manifest / report published on cancel.
  - id: web.backtest_result.view
    kind: function
    signature: "web.backtest_result.view(run_id: RunId) -> BacktestResultView"
    description: T088 layered result view for a completed backtest run.
  - id: web.research.dataset
    kind: function
    signature: "web.research.dataset(request: DatasetRequest) -> DatasetView"
    description: T103 dataset browse / selection surface.
  - id: web.http.serve
    kind: function
    signature: "web.http.serve(host: str, port: int) -> None"
    description: Start the HTTP server.
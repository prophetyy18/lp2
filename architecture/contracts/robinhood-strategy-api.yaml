name: robinhood-strategy-api
version: 1
description: >
  Pure observation -> CandidateAction. The strategy layer reads
  snapshots, queries substitutable components, and returns a typed
  candidate; it does not import RPC, storage, signing, or execution
  (ADR-006). Wall-clock time and unseeded randomness are forbidden
  inside this module.

requires:
  - robinhood-protocol-api
  - robinhood-features-api

provides:
  - id: strategy.evaluate
    kind: function
    signature: "strategy.evaluate(snapshot_set: SnapshotSet, regime_model: RegimeModel, fee_opp_model: FeeOpportunityModel, clock: DeterministicClock, rng: SeededRandomSource) -> CandidateAction"
    description: >
      Run the strategy decision pipeline (T060): validate_proposal
      -> RegimeModel.assess -> FeeOpportunityModel.assess ->
      combine. An UNCERTAIN component outcome returns NO_TRADE with
      the named reason code; the strategy never fabricates a candidate
      past the validator.
  - id: strategy.registry.register
    kind: function
    signature: "strategy.registry.register(name: str, factory: Callable[[], Strategy]) -> None"
    description: >
      Register a strategy implementation by name (T068). Strategies
      register into the registry; the backtest engine never imports a
      concrete strategy module by name.
  - id: strategy.validate_proposal
    kind: function
    signature: "strategy.validate_proposal(proposal: Proposal) -> None"
    description: >
      Validate a candidate proposal before a CandidateAction is built.
      Raises a structured exception family (InvalidTickError,
      StaleSnapshotError, NaNDisplayValueError, InvalidCapitalError)
      on failure; success returns None.
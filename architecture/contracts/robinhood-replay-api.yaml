name: robinhood-replay-api
version: 1
description: >
  Deterministic event replay and pool state reconstruction. Consumes
  typed V4 log records and produces PoolCheckpoint records; preserves
  total ordering on (block_number, transaction_index, log_index).
  Byte-equivalent ReplayOutput across iteration order, chunking, and
  restart boundaries given the same input set.

requires:
  - robinhood-protocol-api
  - robinhood-storage-api

provides:
  - id: replay.replayer.run
    kind: operation
    signature: "replay.replayer.run(events: Iterable[LogRecord]) -> ReplayOutput"
    description: >
      Run deterministic replay over an iterable of typed V4 log
      records. Enforces V4 pool lifecycle (Initialize at most once,
      ModifyLiquidity/Swap/Donate cannot precede Initialize). Bytes
      out are stable across iteration order.
  - id: replay.ticks.range_to_liquidity
    kind: operation
    signature: "replay.ticks.range_to_liquidity(pool_id: PoolId, range: TickRange, current_tick: int) -> int"
    description: >
      Tick / liquidity math: return the position liquidity implied by
      a TickRange given the current pool tick. Integer-only.
  - id: replay.state.checkpoint
    kind: operation
    signature: "replay.state.checkpoint(cursor: EventCursor) -> PoolCheckpoint"
    description: >
      Return the PoolCheckpoint at the named event cursor. The
      checkpoint carries sqrt_price_x96, tick, active_liquidity,
      cumulative volumes, and protocol-fee accumulators.
  - id: replay.fee_surface.project
    kind: operation
    signature: "replay.fee_surface.project(pool_id: PoolId, window: BlockWindow) -> FeeProjection"
    description: >
      Exact range-fee projection over the supplied window. The sole
      dataset/window/cursor/reconstruction-bound fee-growth path
      (T104). T110 / T111 compose this contract; no other module may
      implement an alternative fee path.
name: robinhood-rpc-api
version: 2
description: >
  Bounded JSON-RPC adapter. The only RPC surface V1 exposes is the
  closed method set in T020 (eth_blockNumber, eth_getBlockByNumber,
  eth_getLogs, eth_getTransactionReceipt, eth_call, eth_chainId,
  eth_getCode). No arbitrary RPC, no signing, no broadcasting.

requires:
  - robinhood-protocol-api

provides:
  - id: rpc.adapter.block_header
    kind: operation
    signature: "rpc.adapter.block_header(chain_id: ChainId, block_ref: BlockRef) -> BlockHeader"
    description: >
      Fetch one non-hydrated block header by number or hash. Bounded
      retry on 429 / 5xx / timeout only; no retry on malformed params.
  - id: rpc.adapter.logs
    kind: operation
    signature: "rpc.adapter.logs(chain_id: ChainId, from_block: int, to_block: int, topic_filter: TopicFilter) -> list[LogRecord]"
    description: >
      Bounded eth_getLogs with adaptive range splitting. One
      pool-filtered topic0 OR query per stream, never one per event
      type.

      The topic set is CLOSED and is exactly these five, emitted by the
      PoolManager at `architecture/project.yaml` -> contracts.pool_manager:

        Initialize         (PoolId indexed, currency0, currency1, fee, tickSpacing, hooks, sqrtPriceX96, tick)
        ModifyLiquidity    (PoolId indexed, sender, tickLower, tickUpper, liquidityDelta, salt)
        Swap               (PoolId indexed, sender, amount0, amount1, sqrtPriceX96, liquidity, tick, fee)
        Donate             (PoolId indexed, sender, amount0, amount1)
        ProtocolFeeUpdated (PoolId indexed, protocolFee)

      A caller MAY narrow this with a subset; it may not widen it. There
      is no sixth event and no "any other PoolManager log" mode.

      **`ProtocolFeeUpdated` is not optional and is the one that gets
      forgotten.** The four pool events are the ones that look like pool
      state, so they read as a complete set. The fifth is not about pool
      state at all — it changes `slot0.protocolFee`, which is deducted
      *before* `feeGrowthGlobalX128` accumulates. A stream that omits it
      replays fee growth against a stale protocol fee and returns a
      `tokens_owed` that is wrong and looks entirely reasonable. Dropping
      an event from this list is therefore a correctness bug, not a
      performance choice.

      All five take `PoolId` as the first indexed parameter, so one query
      per pool covers all of them: `topic0 IN (<the five>) AND topic1 =
      <poolId>`.
  - id: rpc.adapter.call
    kind: operation
    signature: "rpc.adapter.call(chain_id: ChainId, block_ref: BlockRef, to: Address, data: bytes) -> bytes"
    description: >
      Block-pinned eth_call. Non-retryable (a malformed call returns
      the same error on retry; classify as non-retryable so the caller
      sees the real failure immediately).
  - id: rpc.adapter.chain_id
    kind: operation
    signature: "rpc.adapter.chain_id(url: str) -> ChainId"
    description: >
      Probe eth_chainId for one endpoint. Used by capability probes
      and the chain-id verification gate.
  - id: rpc.adapter.capability_probe
    kind: operation
    signature: "rpc.adapter.capability_probe(urls: list[str]) -> CapabilityReport"
    description: >
      Per-endpoint capability probe (T024). Reports measured block
      range cap, log interval cap, archive support, and finality. The
      ingestion router uses this to choose endpoints and ranges.
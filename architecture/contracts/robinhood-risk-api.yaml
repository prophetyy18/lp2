name: robinhood-risk-api
version: 2
description: >
  Centralized approve/reject gateway. The single entry point that
  performs the full risk check pipeline before any intent reaches
  paper execution or (after T094) the isolated signer. The gateway
  is deny-by-default: missing data, unknown hooks, or reconciliation
  failure reject the operation rather than fall back to a default.

requires:
  - robinhood-protocol-api
  - robinhood-features-api
  - robinhood-strategy-api

provides:
  - id: risk.evaluate
    kind: operation
    signature: "risk.evaluate(intent: RiskIntent, context: RiskContext, config: RiskConfig) -> RiskDecision"
    description: >
      The full pipeline (T070). Returns a RiskDecision carrying
      RiskVerdict (APPROVED / REJECTED / WARNING / NO_NEW_RISK /
      AUTO_EXIT), RiskScope (GLOBAL / POOL / TOKEN / STRATEGY), and
      a reason code. The decision is byte-identical for two calls
      with equal inputs under equal configuration versions.
  - id: risk.config.current
    kind: operation
    signature: "risk.config.current(version_id: str) -> RiskConfig"
    description: >
      Resolve the RiskConfig for the named version_id. A configuration
      change bumps version_id; the decision records the version it
      was produced under so a future config cannot retroactively alter
      it.
  - id: risk.factors
    kind: data
    signature: "risk.factors() -> RiskFactorList"
    description: >
      Closed vocabulary of risk factor names the gateway can reason over.
      A reason code returned by `risk.evaluate` is one of these names, or
      one of the gateway's own verdicts. This is a contract extension point,
      so adding a name here requires a contract version bump.

      The names have never been enumerated, which is why RiskFactorList is
      named in the signature above and has no declared shape. An array of
      unconstrained strings would resolve the reference and say nothing: the
      whole content of this capability is which names are in the set, and a
      schema that accepts any string does not carry that. Nor can the version
      bump above be checked yet, because there is no list to diff a new name
      against. Enumerating the factors is a decision, and until it is made this
      capability is a promise about a set nobody has written down.

      Migrated from `pricing-api.position.risk_factors` when pricing-api was
      retired on 2026-09-29. It moved rather than being deleted because it is
      the one capability in that contract that did not restate something
      robinhood-features already declared: a closed factor vocabulary is risk
      vocabulary, and robinhood-risk is the module that owns risk. Its former
      sibling `position.exposure` was dropped at the same time — it had no
      consumers, and an exposure figure with no consumer is a capability
      nothing can be tested against.
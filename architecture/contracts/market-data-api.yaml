name: market-data-api
version: 1
description: >
  Read-only access to price/volume time series. The lowest layer: depends on
  no other contract, so every other contract may build on it.

provides:
  - id: series.get
    kind: function
    signature: "series.get(symbol: str, start: datetime, end: datetime, tf: str) -> pd.DataFrame"
    description: >
      OHLCV bars for a symbol. Columns: ts, open, high, low, close, volume.
      tz-aware UTC. Returns an empty frame when no bars exist.
  - id: series.symbols
    kind: function
    signature: "series.symbols() -> list[str]"
    description: Symbols available to the rest of the system.
  - id: series.calendar
    kind: function
    signature: "series.calendar(start: datetime, end: datetime) -> list[datetime]"
    description: Trading sessions between start and end.

requires: []

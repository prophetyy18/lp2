name: robinhood-signer
description: >
  Isolated signer process (G-SIGNER-01, T090). The single boundary
  that may hold private-key material. Reads the encrypted Web3
  Keystore; accepts its password only from a non-echoing terminal.
  Locked on restart. No other module may import a private key or a
  Keystore password.

source: modules/robinhood-signer
provides_contracts:
  - robinhood-signer-api

depends_on:
  - contract: robinhood-protocol-api
    uses:
      - protocol.identity.address.parse
      - protocol.identity.chain_id.parse
    reason: validate the chain_id / address typed parameters the caller passes before any signing operation

readable_extra:
  - modules/robinhood-signer/keystore/**   # the encrypted Web3 Keystore directory; no other module may read this path
  - modules/robinhood-protocol/api/**

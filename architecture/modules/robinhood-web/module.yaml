name: robinhood-web
description: >
  HTTP presentation surface. Prepaper authorization (T073), runs
  list / trigger / monitor / cancel (T087), backtest result view
  (T088), research pages (T103). Translates requests into contract
  calls; owns no business rules. Every route is declared in terms of
  a capability id, not a Python function.

source: modules/robinhood-web
provides_contracts:
  - robinhood-web-api

depends_on:
  - contract: robinhood-application-api
    uses:
      - application.backtest.start
      - application.backtest.resume
      - application.realtime.tick
      - application.reduce_only.execute
      - application.historical_replay.compose
    reason: every Web action is a thin translation of an application use case; Web never implements business logic
  - contract: robinhood-reports-api
    uses:
      - reports.manifest.publish
      - reports.evidence_adapter.t101_view
      - reports.evidence_adapter.t102_view
    reason: the backtest result and research pages read manifest / evidence through the reports contract

# Contract read surface. A cross-module dependency needs BOTH halves: the
# `depends_on` entry above, which says what is used and why, and these
# grants, which say which files may be imported to use it. Without the
# grants every declared dependency is declared-but-unenforceable and the
# AST scanner rejects the import as a BOUNDARY_VIOLATION.
readable_extra:
  - modules/robinhood-application/api/**
  - modules/robinhood-reports/api/**

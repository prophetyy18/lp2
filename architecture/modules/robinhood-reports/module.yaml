name: robinhood-reports
description: >
  Publication of run manifests (T112), run state, validation
  evidence, and the versioned T101/T102 compatibility view (T111).
  Read-only with respect to upstream state; never mutates storage
  or replay state.

source: modules/robinhood-reports
provides_contracts:
  - robinhood-reports-api

depends_on:
  - contract: robinhood-application-api
    uses:
      - application.backtest.start
      - application.historical_replay.compose
    reason: the publisher reads the orchestrator output and historical-replay frames; it does not orchestrate them
  - contract: robinhood-replay-api
    uses:
      - replay.state.checkpoint
      - replay.fee_surface.project
    reason: T111 resolves canonical event bytes and the T104 fee surface through the replay contract; never recomputes them
  - contract: robinhood-features-api
    uses:
      - features.attribution.attribute
    reason: manifest and validation evidence surface T052 attribution facts; the publisher does not implement attribution itself
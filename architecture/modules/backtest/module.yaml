name: backtest
description: Strategy simulation engine over historical data.

source: modules/backtest
provides_contracts:
  - backtest-api

depends_on:
  - contract: market-data-api
    uses:
      - series.get
      - series.calendar
    reason: replay historical bars and sessions
  - contract: pricing-api
    uses:
      - position.mark
      - pricing.quote
    reason: value the simulated portfolio over time

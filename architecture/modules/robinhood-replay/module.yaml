name: robinhood-replay
description: >
  Deterministic event replay (T040), tick / liquidity math (T041),
  pool-state comparison (T042), fee-growth and range-fee projection
  (T104). Consumes typed V4 log records from storage and produces
  PoolCheckpoint records; bytes out are stable across iteration order.

source: modules/robinhood-replay
provides_contracts:
  - robinhood-replay-api

depends_on:
  - contract: robinhood-protocol-api
    uses:
      - protocol.pool_id.compute
      - protocol.identity.chain_id.parse
    reason: PoolId and ChainId scope every PoolCheckpoint; the replayer needs them to address the right pool and namespace
  - contract: robinhood-storage-api
    uses:
      - storage.reader.read_partition
      - storage.manifest.resolve
    reason: the replayer consumes typed log records from partitions and resolves them by manifest; never scans the filesystem
# ---------------------------------------------------------------------------
# The two RPC endpoints. Variable names only, no URLs, no keys.
#
# OWNER DECISION 2026-10-02: two mainnet endpoints. Their values live in
# `.env`, which is gitignored, and both carry API keys. NO URL, no hostname and
# no key fragment enters this file or any other tracked file — a credential is
# exposed by the push, not by the commit, and the person who exposes it is the
# one who did not read this comment. Someone who needs the value reads `.env`;
# someone who needs to know WHICH value is which reads the name below.
#
# The variable names are the fact being recorded. The urls are configuration,
# and configuration that gets rotated belongs in an environment file.
# ---------------------------------------------------------------------------
rpc_endpoints:
  - variable: ROBINHOOD_OFFICIAL_RPC_URL
    role: the project's own node
    established: >
      Every read recorded in this file, and the only endpoint any number in
      this file was measured on. Read 2026-09-29 and 2026-09-30; last re-read
      2026-10-02 for the block and log object facts.
    measured: >
      Chain id 4663. eth_getLogs caps at 10000 results, and at a 30000-block
      range with no address filter and 10000000 with one. Historical state
      served to roughly head-6000 on a rolling edge. Headers served at
      head-20000000. Logs served from head-1000000. HTTP-level 429 under rapid
      bursts, needing ~3-5s of pacing.
  - variable: ROBINHOOD_MAINNET_RPC_URL
    role: a second mainnet endpoint, held for redundancy
    chain_id: UNKNOWN
    measured: >
      NOTHING. Not `eth_chainId`, not a cap, not a window, not a rate limit.
      No read of any kind has been made against this endpoint from this
      repository, so this entry records an intention and not an observation.
    unknown: >
      Chain id included. The variable name says mainnet, and a name is metadata:
      AGENTS.md §4 is explicit that a friendly name is not evidence about the
      underlying thing. So 4663 is an ASSUMPTION here and is written as UNKNOWN
      rather than copied across from the entry above.

      Also unknown, and the reason this endpoint is being added: whether its
      limits match the official one. A public hosted node is commonly MORE
      restrictive — lower log caps, tighter ranges, shorter state retention,
      stricter rate limits — and nothing here establishes that it is, or that
      it is not. A number measured on one endpoint says nothing about the
      other. That is what `rpc.adapter.capability_probe` exists to settle, and
      it is why that capability reports the state window and the log window as
      two numbers rather than one: the two are the pair most likely to differ
      between a project's own node and a hosted one.
    next_step: >
      Probe it. Until `capability_probe` has run against both variables, the
      second endpoint is a configured url with no measured behaviour behind it,
      and the redundancy it appears to provide is a claim rather than a fact.
# ---------------------------------------------------------------------------
# What the RPC endpoint will and will not answer, measured.
#
# These live here rather than in the contract because they are facts about ONE
# host at ONE moment, and the contract must not freeze them: the state window
# below moved between two sweeps taken the same afternoon. `robinhood-rpc-api`
# therefore promises a shape of failure and lets `rpc.adapter.capability_probe`
# measure the number at runtime.
# ---------------------------------------------------------------------------
endpoint_facts:
  - fact: eth_getBlockByHash is available on this chain
    method: eth_getBlockByHash, with `false` for the transactions argument
    endpoint: https://rpc.mainnet.chain.robinhood.com
    chain_id: 4663
    block: "0x48ad6c0"
    retrieved_at: 2026-10-02
    result: >
      `eth_getBlockByHash("0x4abf12ccb5508f3e3d862c420e4cfd9db7153ff8a7d724ee1203664861133b66", false)`
      answered, returning number 0x48ad6c0 and that same hash. The block
      number is the one independently established by
      eth_getBlockByNumber, so the two methods corroborate each other rather
      than the endpoint merely accepting a string. The object carries the same
      23 fields as eth_getBlockByNumber, the same six-element non-hydrated
      `transactions` array, and the same absence of `totalDifficulty`.

      Read on 2026-10-02 by ac-designer, who had been told this method did not
      exist. It did; the earlier claim came from `grep` finding no mention of
      it in this repository, which is evidence about this repository and not
      about the chain. AGENTS.md §4 in the form that actually bites.

      Argument shape, also measured: the second argument is a bool and only a
      bool. Passing a block tag gives -32602 "invalid argument 1: json: cannot
      unmarshal string into Go value of type bool", so the EIP-1898
      `(hash, blockTag)` form is NOT implemented here. A caller wanting a
      pinned read has nothing to pin to and must supply `false`.
  - fact: eth_getTransactionReceipt is available, serves old receipts, and takes no block pin
    method: eth_getTransactionReceipt, one argument
    endpoint: https://rpc.mainnet.chain.robinhood.com
    chain_id: 4663
    block: "0x4aac83b"
    retrieved_at: 2026-10-02
    result: >
      Two independent reads, both against the official endpoint.

      Head 0x4aac83c, pinned block 0x4aac83b, first transaction
      0x3a4091d8297ee2ad081e467ed704aeab2b416a8f64ff872fa067622c599c05dc.
      `eth_getTransactionReceipt` on it answered with blockNumber 0x4aac83b —
      the pinned height — and sixteen fields:
      blockHash, blockNumber, contractAddress, cumulativeGasUsed,
      effectiveGasPrice, from, gasUsed, gasUsedForL1, l1BlockNumber, logs,
      logsBloom, status, to, transactionHash, transactionIndex, type.
      `l1BlockNumber` 0x18e5589 and `gasUsedForL1` 0x0; both are absent from
      the Ethereum JSON-RPC receipt object. An earlier read the same day, at
      block 0x4800b65 on transaction
      0xe085c9c7e4dd89d340005bfe4d58d0c511bab9913bffe55899f09935173cfe14,
      gave the same sixteen fields with `l1BlockNumber` 0x18dfa19 and
      `gasUsedForL1` 0x61c — the same two extras, with values that differ, so
      neither is a constant. This independently confirms the "Receipt object
      extras" row in docs/implement/robinhood-rpc/PLAN.md, which had not been
      re-checked since it was recorded.

      THE LIMITING FACT, and the one that decides whether a receipt capability
      is implementable: this method takes ONE argument. A second argument is
      refused whatever it is — a block number, or the EIP-1898 object
      `{"blockHash": ...}` — with -32602 "too many arguments, want at most 1".
      Note that the refusal arrives as an HTTP 200 carrying a JSON-RPC error
      object, so a client that checks only the HTTP status sees a success.

      WHAT THAT DOES AND DOES NOT RULE OUT. It rules out PINNING: a caller
      cannot ask for a receipt as of a stated block, so the result carries no
      block argument and the adapter cannot promise that what it returns
      describes the block the caller had in mind. It does NOT rule out
      historical reads: a receipt for a transaction 50000 blocks back
      (0x4aa0564) was served without complaint on the same day. So the shape
      of the limitation is not "receipts are tip-only" — an earlier version of
      this entry said that, and the 50000-block read refutes it — but "a
      receipt read carries no block pin, while every other read in
      robinhood-rpc-api is addressed by one." Whether a receipt capability is
      implementable for V1 given that is the Owner's call, not this file's.
  - fact: this endpoint refuses a User-Agent beginning with the exact string `Python-urllib`
    method: eth_chainId, identical request, six User-Agent values
    endpoint: https://rpc.mainnet.chain.robinhood.com
    chain_id: 4663
    retrieved_at: 2026-10-02
    result: >
      HTTP 403 with body `error code: 1010` for `Python-urllib/3.12`,
      `Python-urllib/3.11` and `Python-urllib`. HTTP 200 for an EMPTY
      User-Agent, and for `curl/8.5.0`, `python-requests/2.31`,
      `Mozilla/5.0`, `node-fetch/1.0` and a custom string. The matching is on
      exact capitalisation: `python-urllib/3.12` with a lower-case p answers
      200, `Python-urllib` does not.

      So the rule is NOT "send a User-Agent" — an absent one is fine. The rule
      is "do not send Python's default urllib User-Agent", which is a
      bot-string list matching on prefix. A client using `requests` is
      unaffected; a client using `urllib.request` without overriding the
      header gets a 403 that looks exactly like a network fault and would
      otherwise be misread as one. The 403 arrives before any JSON-RPC
      processing, so there is no `error` object to classify it by — the adapter
      has to read the HTTP status first, and RPC_ENDPOINT_UNREACHABLE is where
      it belongs.
  - fact: eth_call cannot serve a `finalized` block on this endpoint
    method: eth_call at tag `finalized`, owner() as the call
    endpoint: https://rpc.mainnet.chain.robinhood.com
    chain_id: 4663
    block: "0x48b76f1"
    retrieved_at: 2026-09-30T04:59:00Z
    result: >
      -32000 "historical state ... is not available". `safe`, `latest` and
      `pending` all answer. So a `finalized` tag is not a usable block_ref for
      a call here, even though `eth_getBlockByNumber("finalized")` resolves
      that block's number and hash without trouble — the block is known, its
      state is not served.
  - fact: historical state retention is a rolling window whose edge is not stable
    method: eth_call at head-N, swept repeatedly over ~30 minutes
    endpoint: https://rpc.mainnet.chain.robinhood.com
    chain_id: 4663
    block: "0x48b8abf"
    retrieved_at: 2026-09-30T05:12:00Z
    result: >
      Readable to roughly head-6000 and failing by head-6500 in one sweep;
      head-5000 failed in an earlier sweep and succeeded in a later one at a
      later head. Probing ONE fixed block ten times returned OK seven times and
      then -32000 twice. The edge is therefore neither a constant offset from
      head nor a deterministic function of the block number — availability is a
      property of the serving node at request time. No number of blocks can be
      written into a contract as the boundary, because it was already wrong
      twice on the afternoon it was measured.
  - fact: header retention is far wider than state retention
    method: eth_getBlockByNumber by number and by tag
    endpoint: https://rpc.mainnet.chain.robinhood.com
    chain_id: 4663
    block: "0x48ba191"
    retrieved_at: 2026-09-30T05:31:00Z
    result: >
      Headers served at head-20000000, and `finalized`, `safe`, `latest` and
      `pending` all resolved. So a block header is readable far outside the
      window a call is readable in, and the two capabilities do not share a
      horizon. This is why loosening `rpc.adapter.call` does not oblige
      `rpc.adapter.block_header` to change.
  - fact: log retention is far wider than state retention
    method: eth_getLogs with a single topic0 filter
    endpoint: https://rpc.mainnet.chain.robinhood.com
    chain_id: 4663
    block: "0x48b8abf"
    retrieved_at: 2026-09-30T05:14:00Z
    result: >
      ProtocolFeeUpdated logs served from head-1000000 (7290 of them) and from
      as far back as block 0x402776e; Swap logs served from head-100000. So a
      range `rpc.adapter.logs` can serve is not a range `rpc.adapter.call`
      can, and a replay that fetches a wide log range then reads state across
      it will hit the state window partway through. Swap did NOT come back
      from head-1000000 — that query hit the 10000-result cap, which is a
      result-count limit and not a retention limit, so it says nothing about
      how far back Swap goes either way.

  - fact: the block object carries four fields the Ethereum JSON-RPC block object does not, and no totalDifficulty
    method: eth_getBlockByNumber, non-hydrated, at two named blocks
    endpoint: https://rpc.mainnet.chain.robinhood.com
    chain_id: 4663
    block: "0x48ad6c0"
    second_block: "0x4a4c810"
    retrieved_at: 2026-10-02
    result: >
      `baseFeePerGas` 0x172d980, `l1BlockNumber` 0x18e1128, `sendCount` 0xb37,
      `sendRoot` 0xd85d55b464c9971287a5d516a3ddb19635a27e3b0592f41c5fa44331de32b70a,
      all four present; `totalDifficulty` absent from the object at both
      blocks. A strict decoder written against the Ethereum spec throws on a
      real response from this chain, on the four extras and on the missing
      field together. `sendRoot` equalled `extraData` at 0x48ad6c0; whether
      that is a fact or a coincidence of one block is NOT established. The
      meaning of `l1BlockNumber`, `sendCount` and `sendRoot` is UNKNOWN in this
      repository — no document here defines them, and a guessed meaning would
      be inherited by every Card written from it. Full field list at
      0x48ad6c0: baseFeePerGas, difficulty, extraData, gasLimit, gasUsed, hash,
      l1BlockNumber, logsBloom, miner, mixHash, nonce, number, parentHash,
      receiptsRoot, sendCount, sendRoot, sha3Uncles, size, stateRoot,
      timestamp, transactions, transactionsRoot, uncles. `transactions` was an
      array of six hashes, confirming non-hydrated. These observations were
      taken by ac-designer on 2026-10-02 while declaring
      `architecture/schemas/robinhood-rpc-api.yaml`; they are the coordinates
      that file cites.
  - fact: the log object carries a blockTimestamp that reads zero
    method: eth_getLogs, two ranges, every record inspected
    endpoint: https://rpc.mainnet.chain.robinhood.com
    chain_id: 4663
    block: "0x4a4ca04"
    second_range_from: "0x4800000"
    second_range_to: "0x4810000"
    retrieved_at: 2026-10-02
    result: >
      `blockTimestamp` is present on the log object — it is not in the Ethereum
      JSON-RPC log object — and it read "0x0" on all 1351 records inspected:
      1067 records over 0x4a4c810..0x4a4ca04, and 284 over
      0x4800000..0x4810000 under a ProtocolFeeUpdated topic0 filter. The two
      ranges are about 2.6 million blocks apart. The containing block's own
      `timestamp` at 0x4a4c810 read 0x6abf2393, so the zero is not a block
      with no clock. Every record carried exactly these ten fields: address,
      topics, data, blockNumber, transactionHash, transactionIndex, blockHash,
      blockTimestamp, logIndex, removed. `removed` read false in all 1351.
      OWNER DECISION 2026-10-02: a field that is always zero is not data, so
      `blockTimestamp` is not in `LogRecord`; time comes from
      `BlockHeader.timestamp`, addressed by a log's `block_number`. Observed
      topic counts: 2 for ProtocolFeeUpdated, 3 for Swap and ModifyLiquidity,
      4 for Initialize. Donate returned no logs in either range, which is why
      `LogRecord.topics` declares no maximum.

# Product facts about this deployment.
#
# This file is deliberately OUTSIDE `framework/architecture/`. The
# Architecture Framework models modules, contracts, dependencies, boundaries
# and impact — nothing else. A chain id is a fact about the product, not an
# architectural concept, and teaching the framework about it would make the
# framework depend on knowing which chain this repository happens to target.
#
# OWNER DECISION 2026-09-29: 「暂时只需要适配 robinhood」/「只要主网」.
# Owner chose to place chain scope here rather than in a `chain_scope:` key on
# the contract YAML (which would have had the loader enforce it) and rather
# than in a contract `description:` (which is prose nothing checks).
#
# OWNER DECISION 2026-10-02: 「testnet 彻底删除」. The testnet chain id, the
# testnet endpoint and the testnet verification entry are gone from this file
# rather than commented out, and so is the paragraph that argued "mainnet only
# is a POLICY, not a technical impossibility" — its premise was that a
# reachable testnet exists to be dialled, and that premise is now false. The
# replacement further down names the same risk by the two functions that could
# carry it, which is the part of the old paragraph that was worth keeping.
#
# HONEST LIMITATION: nothing validates this file. `framework.architecture.cli
# validate` does not read it, and a contract that names any other chain id
# would still pass validation. This is the accepted cost of keeping the
# framework independent. If that trade turns out wrong, the fix is a
# `chain_scope:` key plus a loader check — not a paragraph in a contract.

chain_scope:
  - 4663            # Robinhood Chain mainnet, 0x1237

# Empty, and left as a key rather than deleted so a later reader can tell
# "deliberately empty" from "nobody has thought about it". The testnet entry
# that used to be here was retired by Owner decision on 2026-10-02; the chain
# id itself went with it rather than surviving as a commented-out value,
# because a value that lives in a comment is one the next reader treats as a
# fixture.
excluded_chains: []

# Per AGENTS.md §4, a mutable fact needs coordinates, not a link. Re-verify
# before citing; a head block number is a record of *when* this was read, not
# a claim that the value ever varies (eth_chainId is a network constant, so
# block-pinning does not apply to it — the head is recorded for reproducibility
# of the read, not because the answer depends on it).
verification:
  - fact: Robinhood Chain mainnet chain id = 4663 (0x1237)
    method: eth_chainId
    endpoint: https://rpc.mainnet.chain.robinhood.com
    retrieved_at: 2026-09-29T04:22:37Z
    head_block: "0x47e02c7"

# 4663 is the only chain id in this repository, and the risk that used to be
# written about is not gone: it changed shape. Deleting the testnet constant
# removes a fixture, not a door. Two functions can still carry a chain id the
# system did not intend, and both are doors by design rather than by accident:
#
#   - `protocol.identity.chain_id.parse` accepts an arbitrary ChainId string.
#     It is a parser; refusing chains is not its job.
#   - `rpc.adapter.chain_id` returns whatever the endpoint it was handed
#     answers. The endpoint is a parameter, so its answer is unverified input.
#
# What stops a wrong chain is the comparison against the expected one — the
# `RPC_CHAIN_ID_MISMATCH` that `rpc.adapter.chain_id` raises — and not the
# absence of a second number to compare against. A tester reading this file
# should treat those two functions as the places to check first, exactly as
# before, and should not read the deletion above as a fix for either.

